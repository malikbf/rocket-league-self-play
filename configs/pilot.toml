# First bounded CPU experiment: 40,960 agent transitions, at most five minutes.
[experiment]
name = "pilot"
seed = 42

[environment]
action_repeat = 8
episode_seconds = 10.0
no_touch_seconds = 5.0

[training]
device = "cpu"
timesteps = 4096
batch_size = 512
minibatch_size = 128
epochs = 2
iterations = 10
timeout_seconds = 300
